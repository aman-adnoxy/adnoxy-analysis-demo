<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adnoxy - Campaign Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
      body {
        font-family: 'Poppins', sans-serif;
        background-color: #ffffff;
        color: #000000;
      }
      h1, h2, h3, h4, h5, h6, .font-heading {
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
      /* Custom scrollbar for dashboard feel */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #f5f5f5; 
      }
      ::-webkit-scrollbar-thumb {
        background: #000000; 
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #333333; 
      }
      .leaflet-container {
        width: 100%;
        height: 100%;
        background: #f5f5f5;
        z-index: 0;
      }
      /* Ensure Leaflet controls look good in B&W */
      .leaflet-bar a {
        background-color: #fff;
        color: #000;
        border-bottom: 1px solid #ccc;
      }
      .leaflet-bar a:hover {
        background-color: #f5f5f5;
        color: #000;
      }

      /* Map Marker Animations */
      @keyframes pulse-ring {
        0% { transform: scale(0.33); opacity: 0; }
        50% { opacity: 0.5; }
        100% { transform: scale(1.5); opacity: 0; }
      }
      
      .marker-pulse::before {
        content: '';
        position: absolute;
        width: 100%;
        height: 100%;
        background-color: inherit;
        border-radius: 50%;
        z-index: -1;
        opacity: 0.6;
        animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
      }

      .marker-pin {
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        transition: transform 0.2s ease-out;
      }
      .marker-pin:hover {
        transform: scale(1.1) translateY(-2px);
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        z-index: 1000 !important;
      }
      
      /* Tooltip Polish */
      .leaflet-tooltip {
        border: 1px solid #e5e5e5 !important;
        border-radius: 4px !important;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1) !important;
        padding: 0 !important;
        background: white !important;
        color: black !important;
        font-family: 'Poppins', sans-serif !important;
      }
      .leaflet-tooltip-top:before {
        border-top-color: #e5e5e5 !important;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.560.0?external=react,react-dom",
    "recharts": "https://esm.sh/recharts@^2.12.7?external=react,react-dom",
    "react/": "https://esm.sh/react@^18.3.1/",
    "react": "https://esm.sh/react@^18.3.1",
    "react-dom/": "https://esm.sh/react-dom@^18.3.1/",
    "react-dom": "https://esm.sh/react-dom@^18.3.1",
    "react-router-dom": "https://esm.sh/react-router-dom@^6.23.1?external=react,react-dom",
    "leaflet": "https://esm.sh/leaflet@1.9.4",
    "react-leaflet": "https://esm.sh/react-leaflet@4.2.1?external=react,react-dom"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
